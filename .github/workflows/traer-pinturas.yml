name: Traer pinturas de dominio público (Wikimedia Commons)

# Wikimedia Commons no es alcanzable desde el entorno donde Claude escribe el juego, pero sí desde los servidores de GitHub.
# Dos modos (herramientas/pinturas/commons_pinturas.py):
#   buscar -> prueba las consultas de herramientas/pinturas/lista_busqueda.json y publica los candidatos (solo dominio público / CC0)
#             en el Release "datos-pinturas-candidatos" (candidatos.json).
#   bajar  -> baja las obras elegidas en herramientas/pinturas/elegidas.json, las reduce a 1280 px y las publica en el Release
#             "datos-pinturas" (pinturas.zip + creditos.json).
# Se ejecuta a mano (workflow_dispatch). No toca el juego.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'buscar o bajar'
        required: true
        default: 'buscar'
      lista:
        description: 'lista de búsqueda (modo buscar)'
        required: false
        default: 'lista_busqueda.json'
      elegidas:
        description: 'lista de obras elegidas (modo bajar)'
        required: false
        default: 'elegidas.json'
      etiqueta:
        description: 'etiqueta del Release de candidatos (modo buscar)'
        required: false
        default: 'datos-pinturas-candidatos'

permissions:
  contents: write

jobs:
  pinturas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.8-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Buscar candidatos
        if: ${{ github.event.inputs.modo == 'buscar' }}
        working-directory: GranEstrategia_v0.1.8/herramientas/pinturas
        run: |
          python3 commons_pinturas.py buscar ${{ github.event.inputs.lista }} /tmp/candidatos.json
          ls -l /tmp/candidatos.json
      - name: Publicar candidatos
        if: ${{ github.event.inputs.modo == 'buscar' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ github.event.inputs.etiqueta }} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ${{ github.event.inputs.etiqueta }} /tmp/candidatos.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Candidatos de pinturas (Commons)" \
            --notes "Resultado de la búsqueda en Wikimedia Commons (solo dominio público o CC0). Insumo para elegir las pinturas del juego; no es parte del juego."
      - name: Bajar las elegidas
        if: ${{ github.event.inputs.modo == 'bajar' }}
        working-directory: GranEstrategia_v0.1.8/herramientas/pinturas
        run: |
          python3 commons_pinturas.py bajar ${{ github.event.inputs.elegidas || 'elegidas.json' }} /tmp/pinturas
          (cd /tmp/pinturas && zip -qr /tmp/pinturas.zip . && du -sh /tmp/pinturas.zip)
      - name: Publicar las pinturas
        if: ${{ github.event.inputs.modo == 'bajar' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete datos-pinturas --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create datos-pinturas /tmp/pinturas.zip /tmp/pinturas/creditos.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pinturas de dominio público (reducidas a 1280 px)" \
            --notes "Obras de dominio público de Wikimedia Commons con sus créditos (creditos.json). Se copian a GranEstrategia_v0.1.8/pinturas/."
