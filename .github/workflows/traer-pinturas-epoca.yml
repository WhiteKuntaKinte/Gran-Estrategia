name: Traer pinturas de época (Wikimedia Commons)

# Wikimedia Commons no es alcanzable desde el entorno donde Claude escribe el juego, pero sí desde los servidores de GitHub.
# herramientas/pinturas/commons_pinturas_epoca.py busca obras de dominio público ANTERIORES a la fecha de cada escenario (año 1, 1096, 1500).
# Se lanza al subir un cambio a herramientas/pinturas/disparar_epoca.txt, cuyas dos palabras son «modo archivo»:
#   buscar lista_epoca_1dc.json    -> hojas de contacto + candidatos.json en el Release «datos-pinturas-epoca-cand»
#   bajar  elegidas_epoca_1dc.json -> pinturas.zip + creditos.json en el Release «datos-pinturas-epoca»
on:
  push:
    branches: [v0.1.8-development]
    paths: ['GranEstrategia_v0.1.8/herramientas/pinturas/disparar_epoca.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pinturas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.8-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Leer la orden
        id: orden
        working-directory: GranEstrategia_v0.1.8/herramientas/pinturas
        run: |
          read modo archivo < disparar_epoca.txt
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "archivo=$archivo" >> "$GITHUB_OUTPUT"
      - name: Buscar candidatos y hojas
        if: ${{ steps.orden.outputs.modo == 'buscar' }}
        working-directory: GranEstrategia_v0.1.8/herramientas/pinturas
        run: |
          python3 commons_pinturas_epoca.py buscar ${{ steps.orden.outputs.archivo }} /tmp/cand
          (cd /tmp/cand && zip -qr /tmp/hojas.zip hojas && ls -l /tmp/hojas.zip /tmp/cand/candidatos.json)
      - name: Publicar candidatos
        if: ${{ steps.orden.outputs.modo == 'buscar' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete datos-pinturas-epoca-cand --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create datos-pinturas-epoca-cand /tmp/hojas.zip /tmp/cand/candidatos.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Candidatos de pinturas de época (Commons)" \
            --notes "Hojas de contacto y candidatos para elegir las pinturas de época. No es parte del juego."
      - name: Bajar las elegidas
        if: ${{ steps.orden.outputs.modo == 'bajar' }}
        working-directory: GranEstrategia_v0.1.8/herramientas/pinturas
        run: |
          python3 commons_pinturas_epoca.py bajar ${{ steps.orden.outputs.archivo }} /tmp/pinturas
          (cd /tmp/pinturas && zip -qr /tmp/pinturas.zip . && du -sh /tmp/pinturas.zip)
      - name: Publicar las pinturas
        if: ${{ steps.orden.outputs.modo == 'bajar' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete datos-pinturas-epoca --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create datos-pinturas-epoca /tmp/pinturas.zip /tmp/pinturas/creditos.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pinturas de época (reducidas a 1280 px)" \
            --notes "Obras de dominio público anteriores a la fecha de cada escenario, con créditos."
