name: Validar y empaquetar Gran Estrategia 0.1.7.6

on:
  push:
    branches:
      - v0.1.7.6-development
    paths:
      - "GranEstrategia_v0.1.7/**"
      - ".github/workflows/validar-y-empaquetar-v0176.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: v0.1.7.6-development
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias cartográficas
        run: python -m pip install numpy scipy pillow pyshp

      - name: Descargar batimetría Natural Earth 10m
        run: |
          curl --location --fail --retry 3 --retry-delay 2 \
            https://naturalearth.s3.amazonaws.com/10m_physical/ne_10m_bathymetry_all.zip \
            --output "$RUNNER_TEMP/ne_10m_bathymetry_all.zip"
          mkdir -p "$RUNNER_TEMP/bathymetry"
          unzip -q "$RUNNER_TEMP/ne_10m_bathymetry_all.zip" -d "$RUNNER_TEMP/bathymetry"
          test "$(find "$RUNNER_TEMP/bathymetry" -name 'ne_10m_bathymetry_*.shp' | wc -l)" -ge 12

      - name: Comprobar sintaxis de herramientas
        working-directory: GranEstrategia_v0.1.7
        run: python -m py_compile herramientas/*.py

      - name: Generar relieve oceánico
        working-directory: GranEstrategia_v0.1.7
        run: |
          python herramientas/construir_profundidad.py \
            --source-dir "$RUNNER_TEMP/bathymetry" \
            --output datos/profundidad_maritima.png

      - name: Regenerar provincias, fronteras y etiquetas reproyectadas
        working-directory: GranEstrategia_v0.1.7
        run: python herramientas/construir_mapa.py

      - name: Validar geometría y textura de profundidad
        working-directory: GranEstrategia_v0.1.7
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from PIL import Image

          root = Path(".")
          meta = json.loads((root / "datos/malla_meta.json").read_text(encoding="utf-8"))
          assert meta["proyeccion"] == "cilindrica_equivalente_50_46", meta
          assert meta["ecuador_y"] == 600.0
          data = json.loads((root / "datos/provincias_juego.json").read_text(encoding="utf-8"))
          assert len(data["provincias"]) == 480, len(data["provincias"])
          assert len(data["anillos"]) >= 1000, len(data["anillos"])

          vertices = np.fromfile(root / "datos/malla_fill_v.bin", dtype="<f4").reshape(-1, 2)
          assert np.isfinite(vertices).all()
          assert vertices[:, 0].min() >= -1 and vertices[:, 0].max() <= 2401
          assert vertices[:, 1].min() >= -1 and vertices[:, 1].max() <= 1201

          png = root / "datos/profundidad_maritima.png"
          with Image.open(png) as image:
              assert image.size == (4800, 2400), image.size
              assert image.mode == "RGBA", image.mode
              assert image.getbbox() is not None
          bathy = json.loads((root / "datos/profundidad_maritima.json").read_text(encoding="utf-8"))
          assert [x["depth_m"] for x in bathy["capas"]] == [0, 200, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]

          required = [
              "datos/provincias_juego.json", "datos/etiquetas.json",
              "datos/malla_fill_v.bin", "datos/malla_fill_i.bin",
              "datos/malla_fill_cc.bin", "datos/malla_fill_cp.bin",
              "datos/malla_costa_v.bin", "datos/malla_costa_uv.bin", "datos/malla_costa_i.bin",
              "datos/malla_frontera_v.bin", "datos/malla_frontera_uv.bin", "datos/malla_frontera_i.bin",
              "datos/malla_prov_v.bin", "datos/malla_prov_uv.bin", "datos/malla_prov_i.bin",
              "datos/profundidad_maritima.png", "datos/profundidad_maritima.json"
          ]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Faltan datos: " + ", ".join(missing))
          print(f"OK: {len(data['provincias'])} territorios, {len(data['anillos'])} anillos y 12 zonas batimétricas")
          print(f"OK: textura {png.stat().st_size:,} bytes; vértices {len(vertices):,}")
          PY

      - name: Instalar Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Importar proyecto y validar scripts Godot
        run: godot --headless --editor --path GranEstrategia_v0.1.7 --quit

      - name: Probar arranque headless
        run: godot --headless --path GranEstrategia_v0.1.7 --quit-after 10

      - name: Guardar datos cartográficos generados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GranEstrategia_v0.1.7/datos
          if ! git diff --cached --quiet; then
            git commit -m "Generar cartografía 0.1.7.6 [skip ci]"
            git push origin HEAD:v0.1.7.6-development
          fi

      - name: Crear ZIP limpio
        run: |
          cd GranEstrategia_v0.1.7
          zip -r ../GranEstrategia_v0.1.7.6.zip . -x ".godot/*"

      - name: Publicar ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GranEstrategia_v0.1.7.6
          path: GranEstrategia_v0.1.7.6.zip
          if-no-files-found: error
          retention-days: 30
